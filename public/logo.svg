<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- التدرج اللون الأساسي (Emerald to Cyan) -->
    <linearGradient id="primaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- تدرج الخلفية الداكنة المتناسقة مع Slate 950 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- تأثير التوهج النيوني (Neon Glow) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- الإطار الخارجي للحاوية -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />
  <rect x="40" y="40" width="432" height="432" rx="104" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- شكل سداسي يرمز لشبكة الرادار والمسح الخوارزمي -->
  <polygon points="256,88 392,160 392,320 256,392 120,320 120,160" fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-opacity="0.25" stroke-dasharray="12 8" />

  <g filter="url(#glow)">
    <!-- شمعة 1 (صاعدة) -->
    <line x1="170" y1="260" x2="170" y2="340" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <rect x="160" y="280" width="20" height="45" rx="4" fill="#10b981" />

    <!-- شمعة 2 (صاعدة قوية) -->
    <line x1="225" y1="200" x2="225" y2="310" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <rect x="215" y="220" width="20" height="65" rx="4" fill="#10b981" />

    <!-- شمعة 3 (تصحيح فرعي - Amber) -->
    <line x1="280" y1="225" x2="280" y2="305" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <rect x="270" y="240" width="20" height="45" rx="4" fill="#f59e0b" />

    <!-- شمعة 4 (اختراق انطلاقة الـ SOP - Cyan) -->
    <line x1="335" y1="130" x2="335" y2="260" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
    <rect x="325" y="150" width="20" height="85" rx="4" fill="url(#primaryGrad)" />

    <!-- خط الاتجاه الصاعد الخوارزمي -->
    <path d="M 130,335 L 195,290 L 250,298 L 375,135" fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- نبتة التنبيه النبضية (Signal Pulse) -->
    <circle cx="375" cy="135" r="14" fill="#06b6d4" />
    <circle cx="375" cy="135" r="26" fill="none" stroke="#06b6d4" stroke-width="4" stroke-opacity="0.6" />
  </g>
</svg>
